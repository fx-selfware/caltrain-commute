<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caltrain Commute</title>
<meta name="description" content="Next train and today's Caltrain times between your home and work stations, loaded from caltrain.com.">
<meta name="theme-color" content="#EEF1F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1215" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Commute">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face { font-family: "Overpass"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/overpass-latin-400.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/overpass-latin-600.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-style: normal; font-weight: 800; font-display: swap; src: url("fonts/overpass-latin-800.woff2") format("woff2"); }

:root {
  --bg: #EEF1F2;
  --surface: #FFFFFF;
  --ink: #12181C;
  --muted: #5B6870;
  --line: #D8DEE1;
  --seg-bg: #DDE3E6;
  --seg-on: #12181C;
  --seg-on-ink: #FFFFFF;
  --sign-bg: #12181C;
  --sign-ink: #F3F5F6;
  --sign-muted: #A3B0B7;
  --sign-rule: #2C363D;
  --signal: #F4C21B;
  --next-bg: #FFF3C4;
  --next-ink: #6B5200;
  --warn: #A3261B;
  --local-bg: #12181C;
  --local-ink: #FFFFFF;
  --limited-bg: #99D7DC;
  --limited-ink: #0A2629;
  --express-bg: #CE202F;
  --express-ink: #FFFFFF;
  --south-bg: #FAE4A7;
  --south-ink: #3A2E00;
  --focus: #1F6FEB;
  --float-shadow: 0 2px 8px rgba(0, 0, 0, .25);
  --font: "Overpass", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0D1215;
    --surface: #151C21;
    --ink: #E6EBEE;
    --muted: #8C9AA3;
    --line: #243038;
    --seg-bg: #1B252C;
    --seg-on: #E6EBEE;
    --seg-on-ink: #0D1215;
    --sign-bg: #1C272E;
    --sign-rule: #33414A;
    --next-bg: #2B2710;
    --next-ink: #F4C21B;
    --warn: #FF8A7A;
    --local-bg: #E6EBEE;
    --local-ink: #0D1215;
    --focus: #6EA8FF;
    --float-shadow: 0 2px 12px rgba(0, 0, 0, .7);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding-inline: 16px;
  /* Room at the bottom so the floating button doesn't cover the footer. */
  padding-block: 0 88px;
  display: grid;
  gap: 16px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Controls */
.controls {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 2;
  background: var(--bg);
  padding-block: 14px 10px;
  display: grid;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
.clock {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--muted);
}
.clock b { color: var(--ink); font-weight: 600; }
#today { white-space: nowrap; }
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: var(--seg-bg);
  border-radius: 10px;
  padding: 3px;
  gap: 3px;
}
.seg button {
  border: 0;
  background: transparent;
  border-radius: 8px;
  padding: 8px 6px 6px;
  font-weight: 600;
  font-size: 14px;
  color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--seg-on-ink); }
.seg.big button { font-size: 17px; font-weight: 800; padding: 11px 6px 9px; }
.seg.small { border-radius: 8px; padding: 2px; gap: 2px; flex: none; }
.seg.small button { font-size: 12px; padding: 5px 9px 3px; border-radius: 6px; }

.controls[hidden] ~ .sign { margin-top: 16px; }

/* Platform sign: next train */
.sign {
  background: var(--sign-bg);
  color: var(--sign-ink);
  border-radius: 14px;
  overflow: hidden;
}
.domes {
  height: 14px;
  background:
    radial-gradient(circle at 7px 7px, rgba(0,0,0,.26) 0 2.6px, transparent 3.2px) 0 0 / 14px 14px,
    var(--signal);
}
.sign-body { padding: 14px 16px 16px; display: grid; gap: 14px; }
.sign-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .1em;
  font-weight: 600;
  color: var(--sign-muted);
}
.count { font-size: 26px; font-weight: 800; color: var(--signal); line-height: 1; }
.count.gone { color: var(--sign-muted); }
.itin .t small, .rows small { font-size: .45em; font-weight: 600; margin-left: 2px; letter-spacing: .02em; }
/* Itinerary: the trip's stations top to bottom on one line. Rows share a height so the
   line can run from the first mark's center to the last one's. */
.itin { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; position: relative; }
.itin::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 20px;
  bottom: 20px;
  border-left: 2px solid var(--sign-muted);
}
.itin li {
  display: grid;
  grid-template-columns: 18px 6.8rem 1fr auto;
  align-items: center;
  column-gap: 12px;
  min-height: 40px;
}
.itin .mark {
  justify-self: center;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--sign-ink);
  box-shadow: 0 0 0 4px var(--sign-bg);
  position: relative;
}
.itin .t { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.01em; white-space: nowrap; }
.itin .s { font-size: 15px; font-weight: 600; min-width: 0; }
.itin .stop .t { font-size: 20px; font-weight: 700; }
.itin .stop .mark { width: 11px; height: 11px; border-radius: 2px; transform: rotate(45deg); background: var(--signal); }
.itin .tag {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 3px 6px 1px;
  border-radius: 4px;
  background: var(--signal);
  color: #12181C;
}
.itin .skipped .mark { background: var(--sign-bg); border: 2px solid var(--sign-muted); }
.itin .skipped .t, .itin .skipped .s { color: var(--sign-muted); }
.itin .skipped .tag { background: transparent; color: var(--sign-muted); border: 1px solid var(--sign-muted); }
.trip { display: grid; gap: 4px; }
.trip-train { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.trip-train b { font-weight: 800; }
.trip-stats { font-size: 13px; color: var(--sign-muted); }
.sign .back {
  justify-self: start;
  border: 1px solid var(--sign-muted);
  border-radius: 8px;
  background: transparent;
  color: var(--sign-ink);
  font-size: 13px;
  font-weight: 600;
  padding: 7px 12px 5px;
}
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--sign-muted); }
.meta b { color: var(--sign-ink); font-weight: 600; }
.after {
  border-top: 1px solid var(--sign-rule);
  padding: 10px 16px 12px;
  font-size: 13px;
  color: var(--sign-muted);
  display: flex;
  gap: 6px 14px;
  flex-wrap: wrap;
}
.after b { color: var(--sign-ink); font-weight: 600; }
.sign .empty { font-size: 22px; font-weight: 800; }
.sign .retry {
  justify-self: start;
  border: 0;
  border-radius: 8px;
  background: var(--signal);
  color: #12181C;
  font-weight: 800;
  padding: 9px 14px 7px;
}

/* Service chips, colored as on the Caltrain timetable */
.chip {
  display: inline-block;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 3px 6px 1px;
  border-radius: 4px;
  line-height: 1.3;
  white-space: nowrap;
}
.chip.local { background: var(--local-bg); color: var(--local-ink); }
.sign .chip.local { background: var(--sign-ink); color: var(--sign-bg); }
.chip.limited { background: var(--limited-bg); color: var(--limited-ink); }
.chip.express { background: var(--express-bg); color: var(--express-ink); }
.chip.south { background: var(--south-bg); color: var(--south-ink); }

/* Timetable */
/* Header and rows share one column set in rem, so it doesn't scale with each row's font size. */
.list { --cols: 4.9rem 4.3rem 1fr auto; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
/* Two work stations: one time column per station, in travel order. */
.list.three { --cols: 4.4rem 4.4rem 4.4rem 1fr; }
.list-head, .rows button {
  display: grid;
  grid-template-columns: var(--cols);
  align-items: center;
  gap: 8px;
  padding-inline: 14px;
}
.list-head {
  padding-block: 10px 8px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
/* Station names as column heads: normal case so they fit, wrapping only between words. */
.list.three .list-head { font-size: 12px; text-transform: none; letter-spacing: 0; }
.list-head span:last-child { text-align: right; }
.list-head .on { color: var(--ink); }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { border-bottom: 1px solid var(--line); }
.rows li:last-child { border-bottom: 0; }
/* Each row is a button that shows its train on the card. */
.rows button {
  width: 100%;
  margin: 0;
  border: 0;
  background: none;
  text-align: start;
  padding-block: 11px 9px;
}
.rows button:focus-visible { outline-offset: -2px; }
@media (hover: hover) { .rows button:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); } }
.rows .dep { font-size: 20px; font-weight: 800; }
.rows .arr { font-size: 17px; font-weight: 600; color: var(--muted); }
.rows .ride { font-size: 13px; color: var(--muted); white-space: nowrap; }
.rows .via { font-size: 15px; color: var(--muted); }
.rows .skip { opacity: .6; }
.list.three .rows .dep { font-size: 18px; }
.list.three .rows .arr { font-size: 16px; }
.list.three .num { min-width: 0; }
.rows .train { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.rows .num { font-size: 13px; color: var(--muted); min-width: 2.2em; text-align: right; }
.rows li.past { opacity: .5; }
.rows li.next { background: var(--next-bg); }
.rows li.next .ride { color: var(--next-ink); font-weight: 600; }
.rows li.picked { opacity: 1; box-shadow: inset 4px 0 0 var(--ink); }
.day-note { padding: 11px 14px 9px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
.more {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  padding: 11px 14px 9px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-align: left;
}

/* Station picker */
.clock-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.gear {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 8px;
  color: var(--muted);
}
.gear:hover { color: var(--ink); }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 16px 16px;
  display: grid;
  gap: 14px;
  margin-top: 16px;
}
.panel h2 { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); font-size: 13px; }
.field { display: grid; gap: 6px; }
.field label, .field .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
  color: var(--muted);
}
.select { position: relative; display: grid; }
/* Own chevron so the gap on the right is the same in every browser. */
.select::after {
  content: "";
  position: absolute;
  right: 18px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
.field select {
  -webkit-appearance: none;
  appearance: none;
  font: inherit;
  font-size: 16px;
  padding: 10px 46px 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.primary {
  border: 0;
  border-radius: 10px;
  background: var(--seg-on);
  color: var(--seg-on-ink);
  font-weight: 800;
  padding: 11px 20px 9px;
}
.secondary {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 10px;
  font-weight: 600;
  padding: 11px 16px 9px;
  color: var(--muted);
}
.field select:disabled { opacity: .55; }
.field .hint { margin: 0; color: var(--muted); font-size: 12px; }
.panel .err { color: var(--warn); font-weight: 600; font-size: 14px; }

footer { font-size: 12px; color: var(--muted); line-height: 1.5; }
footer a { color: var(--ink); }
footer .warn { color: var(--warn); font-weight: 600; }

/* Floating button back to the card, at the right edge of the page column. */
.to-top {
  position: fixed;
  right: max(16px, calc(50% - 240px + 16px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 3;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--seg-on);
  color: var(--seg-on-ink);
  box-shadow: var(--float-shadow);
}

@media (max-width: 380px) {
  .itin li { grid-template-columns: 18px 6rem 1fr auto; column-gap: 10px; }
  .itin .t { font-size: 26px; }
  .list { --cols: 4.6rem 4rem 1fr auto; }
  .list.three { --cols: 4.2rem 4.2rem 4.2rem 1fr; }
  .list-head, .rows button { padding-inline: 12px; gap: 6px; }
}
@media (max-width: 350px) {
  .itin li { grid-template-columns: 18px 5.2rem 1fr auto; }
  .itin .t { font-size: 22px; }
  .itin .stop .t { font-size: 17px; }
  .list { --cols: 4.6rem 4rem 1fr; }
  .ride-h, .rows .ride { display: none; }
  .clock .wd { display: none; }
  .list.three { --cols: 3.8rem 3.8rem 3.8rem 1fr; }
  .list.three .num { display: none; }
  .list.three .chip { font-size: 10px; letter-spacing: .03em; padding-inline: 4px; }
  .list.three .rows .dep { font-size: 15px; }
  .list.three .rows .arr { font-size: 14px; }
  .list.three .rows .via { font-size: 13px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="controls" id="controls" hidden>
    <div class="clock">
      <span id="today"></span>
      <div class="clock-tools">
        <div class="seg small" role="group" aria-label="Schedule">
          <button id="day-weekday" data-day="weekday" aria-pressed="false">Weekday</button>
          <button id="day-weekend" data-day="weekend" aria-pressed="false">Weekend</button>
        </div>
        <button class="gear" id="edit" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M19.37 10.16 L22.50 10.52 L22.50 13.48 L19.37 13.84 L18.51 15.91 L20.47 18.38 L18.38 20.47 L15.91 18.51 L13.84 19.37 L13.48 22.50 L10.52 22.50 L10.16 19.37 L8.09 18.51 L5.62 20.47 L3.53 18.38 L5.49 15.91 L4.63 13.84 L1.50 13.48 L1.50 10.52 L4.63 10.16 L5.49 8.09 L3.53 5.62 L5.62 3.53 L8.09 5.49 L10.16 4.63 L10.52 1.50 L13.48 1.50 L13.84 4.63 L15.91 5.49 L18.38 3.53 L20.47 5.62 L18.51 8.09 Z M15.4 12 A3.4 3.4 0 1 0 8.6 12 A3.4 3.4 0 1 0 15.4 12 Z"/></svg></button>
      </div>
    </div>
    <div class="seg big" role="group" aria-label="Direction">
      <button id="dir-work" data-dir="work" aria-pressed="false">Work</button>
      <button id="dir-home" data-dir="home" aria-pressed="false">Home</button>
    </div>
  </div>

  <form class="panel" id="setup" hidden aria-labelledby="setup-title" novalidate>
    <h2 id="setup-title">Settings</h2>
    <p>Saved only in this browser. The page downloads the whole Caltrain timetable and picks out your trains itself.</p>
    <div class="field">
      <label for="home-stn">Home</label>
      <span class="select"><select id="home-stn"></select></span>
    </div>
    <div class="field">
      <label for="work-stn">Work</label>
      <span class="select"><select id="work-stn"></select></span>
    </div>
    <div class="field">
      <label for="stop-stn">Stop on the way (optional)</label>
      <span class="select"><select id="stop-stn" aria-describedby="stop-hint"></select></span>
      <p class="hint" id="stop-hint"></p>
    </div>
    <div class="field">
      <span class="label" id="clock-label">Time format</span>
      <div class="seg" role="group" aria-labelledby="clock-label">
        <button type="button" data-clock="12" aria-pressed="false">12-hour</button>
        <button type="button" data-clock="24" aria-pressed="false">24-hour</button>
      </div>
    </div>
    <p class="err" id="setup-err" role="alert" hidden></p>
    <div class="actions">
      <button class="primary" id="save" type="submit">Save</button>
      <button class="secondary" id="cancel" type="button">Cancel</button>
    </div>
  </form>

  <section class="sign" id="sign" aria-label="Next train" tabindex="-1"></section>

  <section class="list" id="list" aria-label="Timetable" hidden>
    <div class="list-head" id="listHead"></div>
    <div id="listNote"></div>
    <ol class="rows" id="rows"></ol>
  </section>

  <footer id="foot"></footer>
  <button class="to-top" id="to-top" type="button" aria-label="Back to top" title="Back to top" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
</div>

<script>
// caltrain.com's timetable tab carries the full timetable: one table per direction,
// one column per trip, weekday and weekend service together. Use a URL that answers
// directly; redirects don't carry the header that lets the browser read the page.
const SOURCE = "https://www.caltrain.com/?active_tab=route_explorer_tab";
const CACHE_KEY = "commute.timetable.v2";
const RECHECK_MS = 30 * 60 * 1000;
// Route ids from the timetable -> chip style and label.
const KIND = {
  "Local Weekday": ["local", "Local"],
  "Local Weekend": ["local", "Local"],
  "Limited": ["limited", "Limited"],
  "Express": ["express", "Express"],
  "South County": ["south", "S. County"],
};
const kind = routeId => KIND[routeId] || ["local", routeId];
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem("commute." + key);
    localStorage.setItem("commute." + key, val);
  } catch (e) { return null; }
}

// "8:12am" -> minutes since midnight. Trains after midnight belong to the
// previous service day, so they count past 24:00.
function toMin(text) {
  const m = /^(\d{1,2}):(\d{2})(am|pm)$/.exec(text.trim());
  if (!m) return null;
  const t = ((+m[1] % 12) + (m[3] === "pm" ? 12 : 0)) * 60 + +m[2];
  return t < 180 ? t + 1440 : t;
}

function parseTimetable(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const ids = {};
  for (const o of doc.querySelectorAll('select[name="filter_origin"] option')) {
    if (/^\d+$/.test(o.value)) ids[o.textContent.trim()] = +o.value;
  }
  const dirs = {};
  for (const table of doc.querySelectorAll("table.caltrain_schedule")) {
    const heads = [...table.querySelectorAll("td[data-service-type][data-trip-id]")];
    // Station rows run in travel order for the table's direction.
    const rows = [...table.querySelectorAll("tr[data-stop-id]")].map(tr => ({
      name: tr.querySelector("td.station")?.textContent.trim(),
      times: [...tr.querySelectorAll("td.timepoint")].map(td => toMin(td.textContent)),
    }));
    dirs[table.dataset.direction === "northbound" ? "north" : "south"] = {
      stops: rows.map(r => r.name),
      trips: heads.map((th, col) => ({
        n: th.dataset.tripId, k: th.dataset.routeId, s: th.dataset.serviceType,
        t: rows.map(r => r.times[col] ?? null),
      })),
    };
  }
  if (!dirs.north?.trips.length || !dirs.south?.trips.length || dirs.south.stops.length < 2) {
    throw new Error("The caltrain.com timetable has a layout this page doesn't recognize");
  }
  // Stations listed north to south, as on the printed timetable.
  const stations = dirs.south.stops.map(name => ({ name, id: ids[name] ?? null }));
  return { v: 2, stations, dirs };
}

function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    return c && c.v === 2 && c.dirs && c.stations ? c : null;
  } catch (e) { return null; }
}
function readPrefs() {
  try {
    const p = JSON.parse(store("stations"));
    if (p && typeof p.home === "string" && (typeof p.work === "string" || (Array.isArray(p.works) && p.works.length))) return p;
  } catch (e) {}
  return null;
}

let DATA = readCache();
let prefs = readPrefs();
let status = { state: DATA ? "checking" : "loading" };
let lastCheck = 0;

async function refresh() {
  lastCheck = Date.now();
  status = { state: DATA ? "checking" : "loading" };
  render();
  try {
    const res = await fetch(SOURCE);
    if (!res.ok) throw new Error(`The caltrain.com server returned an error (HTTP ${res.status})`);
    const data = parseTimetable(await res.text());
    data.at = Date.now();
    DATA = data;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    status = { state: "live" };
  } catch (e) {
    status = { state: "failed", msg: e instanceof TypeError ? "Couldn't reach caltrain.com" : e.message };
  }
  renderControls();
  render();
}

// Current time on the Caltrain service clock (Pacific). Before 3am counts as the
// previous service day, with minutes past 24:00, matching the timetable.
function serviceNow() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Los_Angeles", weekday: "short", month: "short", day: "numeric",
    hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23",
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  const h = +get("hour") % 24, m = +get("minute"), s = +get("second");
  let dow = DAYS.indexOf(get("weekday"));
  let sec = h * 3600 + m * 60 + s;
  if (h < 3) { dow = (dow + 6) % 7; sec += 86400; }
  return { dow, sec, min: Math.floor(sec / 60), weekday: get("weekday"), date: `${get("month")} ${get("day")}`, h, m };
}
const dayType = dow => (dow === 0 || dow === 6) ? "weekend" : "weekday";

// 12- or 24-hour clock, saved in the browser. Defaults to the device's regional setting.
function defaultClock() {
  try {
    const hc = new Intl.DateTimeFormat(undefined, { hour: "numeric" }).resolvedOptions().hourCycle;
    return hc === "h23" || hc === "h24" ? "24" : "12";
  } catch (e) { return "12"; }
}
let clock = ["12", "24"].includes(store("clock")) ? store("clock") : defaultClock();
let draftClock = clock;

function fmt(min) {
  const h = Math.floor(min / 60) % 24, m = String(min % 60).padStart(2, "0");
  return clock === "24"
    ? `${String(h).padStart(2, "0")}:${m}`
    : `${h % 12 || 12}:${m}<small>${h < 12 ? "am" : "pm"}</small>`;
}
function fmtPlain(min) { return fmt(min).replace(/<[^>]+>/g, ""); }
// Time to a departure, or since it once the train has left.
function until(sec) {
  if (sec > -60 && sec < 60) return "departing now";
  const mins = Math.floor(Math.abs(sec) / 60);
  const span = mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h ${mins % 60} min`;
  return sec < 0 ? `left ${span} ago` : `in ${span}`;
}
function savedAt(ms) {
  const d = new Date(ms);
  const time = fmtPlain(d.getHours() * 60 + d.getMinutes());
  return d.toDateString() === new Date().toDateString()
    ? `at ${time} today`
    : `on ${d.toLocaleDateString("en-US", { month: "short", day: "numeric" })} at ${time}`;
}
const stopsLabel = n => n === 0 ? "nonstop" : n === 1 ? "1 stop" : `${n} stops`;
// One row of the next-train itinerary. The stop gets a diamond and a tag.
function itinRow(time, name, stop) {
  if (!stop) return `<li><span class="mark"></span><span class="t">${fmt(time)}</span><span class="s">${esc(name)}</span></li>`;
  return time == null
    ? `<li class="stop skipped"><span class="mark"></span><span class="t">—</span><span class="s">${esc(name)}</span><span class="tag">Skips</span></li>`
    : `<li class="stop"><span class="mark"></span><span class="t">${fmt(time)}</span><span class="s">${esc(name)}</span><span class="tag">Stop</span></li>`;
}
const chip = routeId => { const [cls, label] = kind(routeId); return `<span class="chip ${cls}">${esc(label)}</span>`; };

const now0 = serviceNow();
const hash = location.hash.replace("#", "");
const state = {
  dir: hash === "home" ? "home" : "work",
  day: dayType(now0.dow),
  dayPinned: false,
  showPast: false,
  editing: false,
  // A train picked in the timetable: { n, dow }, its number and the service day
  // whose trains were showing, so it doesn't carry over to the next day's.
  pick: null,
};
let setupFilled = false;

const known = name => DATA.stations.some(s => s.name === name);
const ready = () => !!(DATA && prefs && !prefs.works && known(prefs.home) && known(prefs.work) &&
  (!prefs.stop || between(prefs.home, prefs.work, prefs.stop)));
const route = () => state.dir === "work" ? [prefs.home, prefs.work] : [prefs.work, prefs.home];
let upcomingDayType = dayType(now0.dow);
// The service day and next train the timetable on screen was drawn with.
let shown = { dow: null, next: null };

// The service day whose trains come next. Once the day's last train has left (say
// 12:30am, before the 3am cutoff), that's the following day, whose times then count
// from the next midnight: `offset` minutes later on the current service clock.
function upcomingDay(now) {
  const [from, to] = route();
  const todays = trips(from, to, dayType(now.dow));
  return todays.length && todays[todays.length - 1].dep < now.min
    ? { dow: (now.dow + 1) % 7, offset: 1440 }
    : { dow: now.dow, offset: 0 };
}

// The direction table in which `from` comes before `to`, with both stations' rows.
function leg(from, to) {
  for (const dir of Object.values(DATA.dirs)) {
    const a = dir.stops.indexOf(from), b = dir.stops.indexOf(to);
    if (a >= 0 && b >= 0 && a < b) return { dir, a, b };
  }
  return null;
}

// Trips from one station to another on a service day. `at` has each trip's time at
// every station in `show`, or null where it doesn't stop.
function trips(from, to, day, show = []) {
  const l = leg(from, to);
  if (!l) return [];
  const { dir, a, b } = l;
  const rows = show.map(name => [name, dir.stops.indexOf(name)]);
  return dir.trips
    .filter(t => t.s === day && t.t[a] != null && t.t[b] != null)
    .map(t => ({
      n: t.n, k: t.k, dep: t.t[a], arr: t.t[b],
      stops: t.t.slice(a + 1, b).filter(x => x != null).length,
      at: Object.fromEntries(rows.map(([name, i]) => [name, t.t[i] ?? null])),
    }))
    .sort((x, y) => x.dep - y.dep);
}

// Whether `stop` lies strictly between home and work on the line.
function between(home, work, stop) {
  const l = leg(home, work) || leg(work, home);
  if (!l) return false;
  const i = l.dir.stops.indexOf(stop);
  return i > l.a && i < l.b;
}

// With a stop set, the table has a column for each station in travel order.
const columns = (from, to) => prefs.stop ? [from, prefs.stop, to] : null;

// Settings saved by the earlier version held up to two work stations. Keep the
// farther one as work and the nearer one as the stop when it's on the way.
function migratePrefs() {
  if (!DATA || !prefs?.works) return;
  const [a, b] = prefs.works;
  prefs = b && between(prefs.home, b, a) ? { home: prefs.home, work: b, stop: a }
    : b && between(prefs.home, a, b) ? { home: prefs.home, work: a, stop: b }
    : { home: prefs.home, work: a, stop: null };
  store("stations", JSON.stringify(prefs));
  try { localStorage.removeItem("commute.work"); } catch (e) {}
}

function renderControls() {
  document.querySelectorAll("[data-dir]").forEach(b => b.setAttribute("aria-pressed", b.dataset.dir === state.dir));
  document.querySelectorAll("[data-day]").forEach(b => b.setAttribute("aria-pressed", b.dataset.day === state.day));
}

const byName = () => [...DATA.stations].sort((a, b) => a.name.localeCompare(b.name));

function fillSetup() {
  const fill = (sel, value) => {
    sel.replaceChildren(new Option("Choose a station", ""), ...byName().map(s => new Option(s.name, s.name)));
    sel.value = value || "";
  };
  fill($("home-stn"), prefs?.home);
  fill($("work-stn"), prefs?.work);
  fillStops(prefs?.stop);
  draftClock = clock;
  document.querySelectorAll("[data-clock]").forEach(b => b.setAttribute("aria-pressed", b.dataset.clock === draftClock));
  $("setup-err").hidden = true;
  $("cancel").hidden = !ready();
  setupFilled = true;
}

// The stop list only offers stations between the chosen home and work.
function fillStops(value) {
  const home = $("home-stn").value, work = $("work-stn").value, sel = $("stop-stn");
  const options = home && work && home !== work ? byName().filter(s => between(home, work, s.name)) : [];
  sel.replaceChildren(new Option("None", ""), ...options.map(s => new Option(s.name, s.name)));
  sel.value = options.some(s => s.name === value) ? value : "";
  sel.disabled = !options.length;
  $("stop-hint").textContent = !home || !work || home === work ? "Choose home and work first."
    : options.length ? "A station between home and work. It gets its own column in the timetable."
    : "There are no stations between home and work.";
}

function renderFooter() {
  let text = "";
  if (DATA && status.state === "live") {
    text = `Timetable loaded from caltrain.com ${savedAt(DATA.at)}. Scheduled times only; delays aren't shown.`;
  } else if (DATA && status.state === "checking") {
    text = `Showing the timetable saved ${savedAt(DATA.at)}. Checking caltrain.com for changes…`;
  } else if (DATA && status.state === "failed") {
    text = `<span class="warn">${esc(status.msg)}.</span> Showing the timetable saved ${savedAt(DATA.at)}.`;
  }
  let link = "";
  if (ready()) {
    const [from, to] = route();
    const id = n => DATA.stations.find(s => s.name === n)?.id;
    if (id(from) && id(to)) {
      link = ` <a href="https://www.caltrain.com/?service=${state.day}&active_tab=route_explorer_tab&origin=${id(from)}&destination=${id(to)}" target="_blank" rel="noopener">Open this trip on caltrain.com</a>`;
    }
  }
  $("foot").innerHTML = `${text}${link} Not affiliated with Caltrain.`;
}

// Rewrite an element only when its HTML changes, so the 15-second redraw leaves
// focus and taps in progress alone.
const drawn = new WeakMap();
function put(el, html) {
  if (drawn.get(el) === html) return;
  drawn.set(el, html);
  el.innerHTML = html;
}
const rowButton = n => [...$("rows").querySelectorAll("button")].find(b => b.dataset.n === n);

// If drawing replaced the focused button, focus its replacement, or the card if
// there isn't one.
function render() {
  const had = document.activeElement;
  draw();
  if (had && !had.isConnected) ((had.id ? $(had.id) : rowButton(had.dataset.n)) ?? $("sign")).focus({ preventScroll: true });
  updateTop();
}

// The floating button shows while the card is scrolled up behind the controls.
function updateTop() {
  const controls = $("controls");
  $("to-top").hidden = $("list").hidden ||
    $("sign").getBoundingClientRect().bottom > (controls.hidden ? 0 : controls.getBoundingClientRect().bottom);
}

function draw() {
  const now = serviceNow();
  migratePrefs();
  const isReady = ready();
  const svc = isReady ? upcomingDay(now) : { dow: now.dow, offset: 0 };
  const today = upcomingDayType = dayType(svc.dow);
  // Follow the day whose trains come next (e.g. into Saturday after Friday's last
  // train) unless the viewer picked another one.
  if (!state.dayPinned && state.day !== today) { state.day = today; state.showPast = false; state.pick = null; renderControls(); }
  const showSetup = !!DATA && (state.editing || !isReady);
  if (showSetup && !setupFilled) fillSetup();
  $("setup").hidden = !showSetup;
  $("controls").hidden = !isReady || showSetup;
  $("sign").hidden = showSetup;
  $("list").hidden = !isReady || showSetup;
  $("today").innerHTML = `<b><span class="wd">${now.weekday}, </span>${now.date}</b> · ${fmtPlain(now.h * 60 + now.m)}`;
  renderFooter();
  if (showSetup) return;

  const sign = $("sign");
  if (!DATA) {
    put(sign, status.state === "failed"
      ? `<div class="domes"></div><div class="sign-body">
           <div class="empty">Couldn't load the timetable</div>
           <div class="meta">${esc(status.msg)}.</div>
           <button class="retry" id="retry" type="button">Try again</button>
         </div>`
      : `<div class="domes"></div><div class="sign-body"><div class="empty">Loading timetable…</div></div>`);
    const retry = $("retry");
    if (retry) retry.onclick = refresh;
    return;
  }

  const [from, to] = route();
  const routeText = `${esc(from)} → ${esc(to)}`;
  const scheduleName = `${state.day === "weekend" ? "Weekend" : "Weekday"} schedule`;
  const isToday = state.day === today;
  const cols = columns(from, to);
  const list = trips(from, to, state.day, cols || []);
  const nextIdx = isToday ? list.findIndex(t => t.dep + svc.offset >= now.min) : -1;
  shown = { dow: svc.dow, next: list[nextIdx]?.n };
  if (state.pick && (state.pick.dow !== svc.dow || !list.some(t => t.n === state.pick.n))) state.pick = null;
  const pickIdx = state.pick ? list.findIndex(t => t.n === state.pick.n) : -1;
  const secs = t => (t.dep + svc.offset) * 60 - now.sec;
  const daySuffix = svc.offset ? ` · ${DAY_NAMES[svc.dow]}` : "";

  // One train on the card, with the two after it. On the other day's schedule the
  // trains aren't today's, so there's no countdown.
  const trainCard = (i, eyebrow, back) => {
    const t = list[i], later = list.slice(i + 1, i + 3);
    const then = l => `<span><b>${fmtPlain(l.dep)}</b> ${esc(kind(l.k)[1])}${isToday ? ` · ${until(secs(l))}` : ""}</span>`;
    return `
      <div class="domes"></div>
      <div class="sign-body">
        <div class="sign-top"><span class="eyebrow">${eyebrow}</span>${isToday
          ? `<span class="count${secs(t) <= -60 ? " gone" : ""}">${until(secs(t))}</span>` : ""}</div>
        <ol class="itin" aria-label="${routeText}">
          ${itinRow(t.dep, from)}
          ${prefs.stop ? itinRow(t.at[prefs.stop], prefs.stop, true) : ""}
          ${itinRow(t.arr, to)}
        </ol>
        <div class="trip">
          <div class="trip-train">${chip(t.k)}<span>Train <b>${esc(t.n)}</b></span></div>
          <div class="trip-stats">${t.arr - t.dep} min ride · ${stopsLabel(t.stops)}</div>
        </div>
        ${back ? `<button class="back" id="back" type="button">${back}</button>` : ""}
      </div>
      ${later.length ? `<div class="after"><span>Then</span>${later.map(then).join("")}</div>` : ""}`;
  };

  // A picked train shows unless it's the next train anyway.
  const selected = pickIdx >= 0 && pickIdx !== nextIdx;
  sign.setAttribute("aria-label", selected ? "Selected train" : "Next train");
  if (!list.length) {
    put(sign, `
      <div class="domes"></div>
      <div class="sign-body">
        <span class="eyebrow">${routeText}</span>
        <div class="empty">No ${state.day} trains stop at both stations</div>
      </div>`);
  } else if (selected) {
    put(sign, isToday
      ? trainCard(pickIdx, `Selected train${daySuffix}`, "Back to next train")
      : trainCard(pickIdx, scheduleName, "Back to summary"));
  } else if (isToday && nextIdx >= 0) {
    put(sign, trainCard(nextIdx, `Next train${daySuffix}`));
  } else if (isToday) {
    const tomorrow = (svc.dow + 1) % 7;
    const first = trips(from, to, dayType(tomorrow))[0];
    put(sign, `
      <div class="domes"></div>
      <div class="sign-body">
        <span class="eyebrow">${routeText}</span>
        <div class="empty">No more trains tonight</div>
        ${first ? `<div class="meta">First train ${DAY_NAMES[tomorrow]}: <b>${fmtPlain(first.dep)}</b> ${chip(first.k)} <span>Train ${esc(first.n)}</span></div>` : ""}
      </div>`);
  } else {
    const first = list[0], last = list[list.length - 1];
    put(sign, `
      <div class="domes"></div>
      <div class="sign-body">
        <span class="eyebrow">${scheduleName} · ${routeText}</span>
        <div class="meta">${list.length} trains · first <b>${fmtPlain(first.dep)}</b> · last <b>${fmtPlain(last.dep)}</b></div>
      </div>`);
  }
  const back = $("back");
  if (back) back.onclick = () => { state.pick = null; render(); sign.focus({ preventScroll: true }); };

  const pastCount = isToday ? (nextIdx < 0 ? list.length : nextIdx) : 0;
  // A picked earlier train stays in the table, so it isn't one the button hides.
  const hideable = pastCount - (pickIdx >= 0 && pickIdx < pastCount ? 1 : 0);
  put($("listNote"), isToday && svc.offset
    ? `<div class="day-note">${DAY_NAMES[svc.dow]}'s trains</div>`
    : hideable
    ? `<button class="more" id="toggle-past" type="button" aria-expanded="${state.showPast}">${state.showPast ? "Hide" : "Show"} ${hideable} earlier train${hideable === 1 ? "" : "s"}</button>`
    : "");
  const btn = $("toggle-past");
  if (btn) btn.onclick = () => { state.showPast = !state.showPast; render(); };

  $("list").classList.toggle("three", !!cols);
  $("listHead").innerHTML = cols
    ? cols.map(name => `<span class="${name === from || name === to ? "on" : ""}">${esc(name)}</span>`).join("") + "<span>Train</span>"
    : `<span>Depart</span><span>Arrive</span><span class="ride-h">Ride</span><span>Train</span>`;
  const role = name => name === from ? "dep" : name === to ? "arr" : "via";
  put($("rows"), list.map((t, i) => {
    const past = i < pastCount;
    if (past && !state.showPast && i !== pickIdx) return "";
    const cls = (past ? "past" : i === nextIdx ? "next" : "") + (i === pickIdx ? " picked" : "");
    const times = cols
      ? cols.map(name => t.at[name] == null
          ? `<span class="${role(name)} skip" aria-label="doesn't stop">—</span>`
          : `<span class="${role(name)}">${fmt(t.at[name])}</span>`).join("")
      : `<span class="dep">${fmt(t.dep)}</span><span class="arr">${fmt(t.arr)}</span><span class="ride">${t.arr - t.dep} min</span>`;
    return `<li class="${cls}"><button type="button" data-n="${esc(t.n)}" aria-pressed="${i === pickIdx}">${times}<span class="train">${chip(t.k)}<span class="num">${esc(t.n)}</span></span></button></li>`;
  }).join(""));
}

$("setup").onsubmit = e => {
  e.preventDefault();
  const home = $("home-stn").value, work = $("work-stn").value, stop = $("stop-stn").value || null;
  const err = !home ? "Choose your home station."
    : !work ? "Choose your work station."
    : work === home ? "Home and work need to be different stations."
    : stop && !between(home, work, stop) ? `The stop has to be between ${home} and ${work}.`
    : "";
  $("setup-err").textContent = err;
  $("setup-err").hidden = !err;
  if (err) return;
  prefs = { home, work, stop };
  state.pick = null;
  store("stations", JSON.stringify(prefs));
  clock = draftClock;
  store("clock", clock);
  state.editing = false;
  setupFilled = false;
  renderControls();
  render();
};
document.querySelectorAll("[data-clock]").forEach(b => b.onclick = () => {
  draftClock = b.dataset.clock;
  document.querySelectorAll("[data-clock]").forEach(x => x.setAttribute("aria-pressed", x.dataset.clock === draftClock));
});
$("home-stn").onchange = $("work-stn").onchange = () => fillStops($("stop-stn").value);
$("cancel").onclick = () => { state.editing = false; setupFilled = false; render(); };
$("edit").onclick = () => { state.editing = true; setupFilled = false; render(); };
document.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => {
  if (b.dataset.dir !== state.dir) state.pick = null;
  state.dir = b.dataset.dir; state.showPast = false; renderControls(); render();
});
document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
  if (b.dataset.day !== state.day) state.pick = null;
  state.day = b.dataset.day;
  state.dayPinned = state.day !== upcomingDayType;
  state.showPast = false; renderControls(); render();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (Date.now() - lastCheck > RECHECK_MS) refresh(); else render();
});
// Tapping a row shows its train on the card; tapping it again, or the next train's
// row, goes back to the next train. Once the top of the card is scrolled away, the
// tapped row stays where it was on screen, even though the card above it changes
// height. While the top is in view the page stays put, so the heading and countdown
// the tap was for don't slide under the controls.
$("rows").onclick = e => {
  const b = e.target.closest("button[data-n]");
  if (!b) return;
  const n = b.dataset.n, dow = shown.dow;
  const top = b.getBoundingClientRect().top, listTop = $("list").getBoundingClientRect().top;
  const cardInView = $("sign").getBoundingClientRect().top >= $("controls").getBoundingClientRect().bottom;
  // This handler keeps things in place itself; hold off the browser's scroll anchoring.
  document.body.style.overflowAnchor = "none";
  requestAnimationFrame(() => document.body.style.overflowAnchor = "");
  // Catch up first, in case a train has left since the last redraw. The pick keeps the
  // day of the table that was tapped, so if that has moved on to the next day's
  // trains, the next redraw drops it.
  render();
  state.pick = n === state.pick?.n || n === shown.next ? null : { n, dow };
  render();
  // An unpicked train among collapsed earlier ones disappears; then keep the table in place.
  const moved = rowButton(n);
  const dy = moved ? moved.getBoundingClientRect().top - top : $("list").getBoundingClientRect().top - listTop;
  scrollBy(0, cardInView ? Math.min(dy, 0) : dy);
};
$("to-top").onclick = () => {
  scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  $("sign").focus({ preventScroll: true });
};
